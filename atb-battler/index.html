<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d1020" />
    <title>ATB Battler</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  </head>
  <body>
    <main id="game">
      <header class="topbar">
        <div class="wave" id="wave">Wave 1/3</div>
        <div class="toggles">
          <button id="btn-mode" class="toggle" title="ATB mode">Active</button>
          <button id="btn-speed" class="toggle" title="Battle speed">1×</button>
          <button id="btn-auto" class="toggle" title="Auto battle">Auto</button>
        </div>
      </header>

      <section class="field" id="field">
        <div class="enemies" id="enemies"></div>
        <div class="hero-anchor" id="hero-anchor"></div>
      </section>

      <div class="banner" id="banner"></div>

      <section class="hero" id="hero">
        <div class="hero-stats">
          <div class="hero-name">Hero <span class="status" id="hero-status"></span></div>
          <div class="stat">
            <span class="label">HP</span>
            <div class="bar hp"><div class="fill" id="hero-hp-fill"></div></div>
            <span class="value" id="hero-hp"></span>
          </div>
          <div class="stat">
            <span class="label">MP</span>
            <div class="bar mp"><div class="fill" id="hero-mp-fill"></div></div>
            <span class="value" id="hero-mp"></span>
          </div>
          <div class="stat">
            <span class="label">ATB</span>
            <div class="bar atb"><div class="fill" id="hero-atb-fill"></div></div>
            <span class="value"></span>
          </div>
        </div>
      </section>

      <nav class="commands" id="commands"></nav>

      <div class="overlay hidden" id="overlay">
        <div class="overlay-card">
          <h2 id="overlay-title"></h2>
          <p id="overlay-sub"></p>
          <button id="overlay-btn" class="primary">Retry</button>
        </div>
      </div>
    </main>
    <script type="module" src="./src/ui/main.js"></script>
  </body>
</html>
